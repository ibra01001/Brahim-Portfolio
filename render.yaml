services:
  - type: web
    name: livewire-portfolio
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Livewire Portfolio
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://livewire-portfolio.onrender.com
        # Update to your actual Render URL after first deploy
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Add if you use mail:
      # - key: MAIL_MAILER
      #   value: smtp
      # - key: MAIL_HOST
      #   sync: false
      # - key: MAIL_PASSWORD
      #   sync: false

databases:
  - name: portfolio-db
    plan: starter
    databaseName: portfolio
    user: portfolio
    postgresVersion: "15"
