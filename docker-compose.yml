version: '3.8'
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    image: livewire-portfolio-app
    volumes:
      - ./:/var/www/html
      - ./vendor:/var/www/html/vendor
      - ./.env.docker:/var/www/html/.env:ro
    env_file:
      - .env.docker
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - PORT=8000
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=portfolio
      - DB_USERNAME=portfolio
      - DB_PASSWORD=secret
      - CACHE_STORE=database
      - SESSION_DRIVER=database
      - QUEUE_CONNECTION=database
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy
    # Use .env.docker as the active .env so DB_CONNECTION=pgsql is picked up,
    # wait for Postgres, then run migrations + seed on each start (idempotent).
    entrypoint: []
    command: sh -c "cp .env.docker .env 2>/dev/null || true && mkdir -p storage/framework/{sessions,views,cache} storage/app/public bootstrap/cache storage/logs && chmod -R 775 storage bootstrap/cache || true && php artisan config:clear || true && php artisan package:discover --ansi || true && until pg_isready -h db -p 5432 -U portfolio -d portfolio; do echo 'Waiting for Postgres...'; sleep 2; done && php artisan migrate --force --no-interaction || true && php artisan db:seed --class=PortfolioDataSeeder --force || true && if [ ! -L public/storage ]; then php artisan storage:link || true; fi && exec php artisan serve --host=0.0.0.0 --port=8000"

volumes:
  pgdata: {}
