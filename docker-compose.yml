version: '3.8'
services:
  app:
    build: .
    image: livewire-portfolio-app
    volumes:
      - ./:/var/www/html
      - ./vendor:/var/www/html/vendor
    env_file:
      - .env.docker
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8000"
    # Disable production entrypoint for local (avoid chown that breaks host perms)
    entrypoint: []
    command: sh -c "mkdir -p storage/framework/{sessions,views,cache} storage/app/public bootstrap/cache storage/logs && chmod -R 775 storage bootstrap/cache || true && php artisan package:discover --ansi || true && php artisan migrate --force --no-interaction || true && php artisan db:seed --class=PortfolioDataSeeder --force || true && if [ ! -L public/storage ]; then php artisan storage:link || true; fi && exec php artisan serve --host=0.0.0.0 --port=8000"

  # Use the app container's built-in server for development to avoid nginx mount issues
  # Expose port 8000 and run the Laravel development server inside the container.

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=homestead
      - POSTGRES_USER=homestead
      - POSTGRES_PASSWORD=secret
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homestead -d homestead"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    volumes:
      - redis-data:/data

volumes:
  db-data:
  redis-data:
