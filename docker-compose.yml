version: '3.8'
services:
  app:
    build: .
    image: livewire-portfolio-app
    volumes:
      - ./:/var/www/html
      - ./vendor:/var/www/html/vendor
    env_file:
      - .env.docker
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - PORT=8000
    ports:
      - "8080:8000"
    # Use .env.docker as the active .env so DB_CONNECTION=sqlite is picked up,
    # then run migrations + seed on each start (idempotent with SQLite).
    entrypoint: []
    command: sh -c "cp .env.docker .env && mkdir -p storage/framework/{sessions,views,cache} storage/app/public bootstrap/cache storage/logs && chmod -R 775 storage bootstrap/cache || true && php artisan config:clear || true && php artisan package:discover --ansi || true && php artisan migrate --force --no-interaction || true && php artisan db:seed --class=PortfolioDataSeeder --force || true && if [ ! -L public/storage ]; then php artisan storage:link || true; fi && exec php artisan serve --host=0.0.0.0 --port=8000"

volumes: {}
